<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SentinelNet — 3D Interactive OS &amp; DBMS Visual Studio</title>
  <style>
    :root {
      --bg: #eef4fa;
      --surface: rgba(255, 255, 255, 0.92);
      --text: #0f172a;
      --muted: #64748b;
      --border: rgba(203, 213, 225, 0.8);
      --m1: #0284c7; --m1-grad: linear-gradient(135deg, #0284c7, #38bdf8); --m1-soft: #e0f2fe;
      --m2: #059669; --m2-grad: linear-gradient(135deg, #059669, #34d399); --m2-soft: #d1fae5;
      --m3: #7c3aed; --m3-grad: linear-gradient(135deg, #7c3aed, #c084fc); --m3-soft: #ede9fe;
      --m4: #ea580c; --m4-grad: linear-gradient(135deg, #ea580c, #fb923c); --m4-soft: #ffedd5;
      --green: #16a34a; --green-soft: #dcfce7;
      --red: #dc2626; --red-soft: #fee2e2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #f1f5f9 45%, #ede9fe 100%);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Live 3D Perspective Background Canvas */
    .bg-3d-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      perspective: 900px;
    }
    .bg-grid-floor {
      position: absolute;
      width: 200%;
      height: 200%;
      left: -50%;
      top: -20%;
      background-image:
        linear-gradient(to right, rgba(2, 132, 199, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(124, 58, 237, 0.08) 1px, transparent 1px);
      background-size: 54px 54px;
      transform: rotateX(58deg) translateZ(-120px);
      animation: gridDrift 22s linear infinite;
    }
    @keyframes gridDrift {
      0% { transform: rotateX(58deg) translateZ(-120px) translateY(0px); }
      100% { transform: rotateX(58deg) translateZ(-120px) translateY(54px); }
    }
    .orb-3d {
      position: absolute;
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(167, 139, 250, 0.16));
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.06);
      animation: floatShape 11s ease-in-out infinite;
    }
    .orb-1 { width: 220px; height: 220px; top: 8%; right: 6%; transform: rotate(24deg); }
    .orb-2 { width: 170px; height: 170px; bottom: 10%; left: 4%; border-radius: 50%; animation-delay: -4s; }
    .orb-3 { width: 130px; height: 130px; top: 48%; right: 14%; transform: rotate(-18deg); animation-delay: -7s; }
    @keyframes floatShape {
      0%, 100% { transform: translateY(0px) rotate(18deg) scale(1); }
      50% { transform: translateY(-22px) rotate(32deg) scale(1.05); }
    }

    /* Header & Nav */
    header, .nav-bar, main { position: relative; z-index: 2; }
    header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 1.1rem 2rem;
    }
    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand h1 { font-size: 1.55rem; font-weight: 900; letter-spacing: -0.4px; }
    .brand h1 span { color: var(--m1); }

    .nav-bar {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 2rem;
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .nav-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      gap: 0.65rem;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: rgba(248, 250, 252, 0.9);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.6rem 1.3rem;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.88rem;
      transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .tab-btn:hover { color: var(--text); transform: translateY(-2px); }
    .tab-btn.active {
      background: #0f172a;
      color: #fff;
      border-color: #0f172a;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.22);
    }

    main { max-width: 1400px; margin: 0 auto; padding: 2rem 2rem 4rem; perspective: 1300px; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.75rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .top-bar h2 { font-size: 1.75rem; font-weight: 900; letter-spacing: -0.3px; }

    /* Larger, Spacious Visual Cards */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(410px, 1fr));
      gap: 1.85rem;
    }
    .outer-card {
      background: var(--surface);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 18px 36px -10px rgba(15, 23, 42, 0.1), 0 6px 14px -4px rgba(15, 23, 42, 0.05);
      overflow: hidden;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.32s ease;
      display: flex;
      flex-direction: column;
      min-height: 295px;
    }
    .outer-card:hover {
      transform: translateY(-10px) rotateX(2.5deg) rotateY(-2deg) scale(1.015);
      box-shadow: 0 30px 55px -12px rgba(15, 23, 42, 0.18);
    }
    .card-ribbon { height: 9px; width: 100%; }
    .outer-body {
      padding: 1.65rem 1.75rem 1.75rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
      flex: 1;
    }
    .outer-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; }
    .outer-title { font-size: 1.22rem; font-weight: 900; color: #0f172a; line-height: 1.3; }
    .outer-desc { font-size: 0.9rem; color: #475569; line-height: 1.5; }

    /* Embedded Visual Diagram Container on Outer Card */
    .card-diagram {
      margin-top: 0.35rem;
      background: linear-gradient(145deg, #f8fafc, #f1f5f9);
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 0.85rem 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 118px;
      box-shadow: inset 0 2px 6px rgba(15, 23, 42, 0.03);
    }
    .card-diagram svg { width: 100%; height: 98px; overflow: visible; }

    .pill {
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.4px;
      white-space: nowrap;
    }

    /* Full-Screen Interactive 3D Modal Studio */
    .studio-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      animation: fadeIn 0.22s ease;
    }
    .studio-overlay.open { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .studio-window {
      background: rgba(255, 255, 255, 0.97);
      width: 100%;
      max-width: 1150px;
      max-height: 92vh;
      border-radius: 28px;
      box-shadow: 0 35px 80px rgba(15, 23, 42, 0.3);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      animation: pop3D 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes pop3D {
      from { opacity: 0; transform: scale(0.93) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .studio-header {
      padding: 1.4rem 1.9rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 10;
    }
    .studio-body {
      padding: 1.9rem;
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 1.85rem;
      align-items: stretch;
    }
    @media (max-width: 880px) { .studio-body { grid-template-columns: 1fr; } }

    .btn-action {
      border: none;
      color: #fff;
      padding: 0.65rem 1.25rem;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.86rem;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.16);
      transition: transform 0.15s ease;
    }
    .btn-action:hover { transform: translateY(-2px); }

    /* 3D Visual Stage Components inside Studio */
    .stage-3d {
      background: linear-gradient(145deg, #f8fafc, #eef2f6);
      border: 1px solid #e2e8f0;
      border-radius: 22px;
      padding: 1.6rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1.25rem;
      perspective: 900px;
      box-shadow: inset 0 2px 8px rgba(15, 23, 42, 0.04);
    }
    .stage-title { font-size: 0.78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.7px; color: var(--muted); }

    .pillars-arena {
      height: 225px;
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      gap: 1rem;
      padding: 1rem 0.5rem 0.25rem;
      border-bottom: 3px solid #cbd5e1;
    }
    .pillar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
      gap: 0.45rem;
    }
    .pillar-val { font-size: 0.86rem; font-weight: 900; color: #0f172a; }
    .pillar-3d {
      width: 62px;
      border-radius: 11px 11px 4px 4px;
      transform: rotateY(-14deg) rotateX(6deg);
      box-shadow: 8px 8px 18px rgba(15, 23, 42, 0.18), inset -6px 0 12px rgba(0, 0, 0, 0.14), inset 4px 4px 10px rgba(255, 255, 255, 0.45);
      transition: height 0.75s cubic-bezier(0.34, 1.56, 0.64, 1);
      animation: float3D 3.2s ease-in-out infinite;
    }
    @keyframes float3D {
      0%, 100% { transform: rotateY(-14deg) rotateX(6deg) translateY(0px); }
      50% { transform: rotateY(-10deg) rotateX(4deg) translateY(-6px); }
    }
    .pillar-lbl { font-size: 0.78rem; font-weight: 800; color: #334155; text-align: center; }

    .ring-wrap { display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .ring-3d {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 16px 32px rgba(15, 23, 42, 0.15), inset 0 4px 10px rgba(255, 255, 255, 0.6);
      transform: rotateX(12deg);
      animation: pulseRing 3s ease-in-out infinite;
    }
    @keyframes pulseRing {
      0%, 100% { transform: rotateX(12deg) scale(1); }
      50% { transform: rotateX(6deg) scale(1.04); }
    }
    .ring-hole {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 4px 10px rgba(15, 23, 42, 0.1);
    }

    .hex-flow {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.65rem;
      padding: 1.2rem 0;
    }
    .hex-node {
      background: #fff;
      border: 2px solid #cbd5e1;
      border-bottom: 6px solid #94a3b8;
      border-radius: 16px;
      padding: 0.85rem 1.1rem;
      font-weight: 900;
      font-size: 0.9rem;
      text-align: center;
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.08);
      animation: bobNode 2.6s ease-in-out infinite;
    }
    .hex-node:nth-child(3) { animation-delay: 0.4s; }
    .hex-node:nth-child(5) { animation-delay: 0.8s; }
    @keyframes bobNode {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .drive-bay { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.8rem; }
    .drive-3d {
      background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 100%);
      border: 1px solid #cbd5e1;
      border-bottom: 7px solid #64748b;
      border-radius: 14px;
      padding: 1rem 0.5rem;
      text-align: center;
      font-weight: 900;
      font-size: 0.82rem;
      box-shadow: 0 10px 18px rgba(15, 23, 42, 0.1);
      transform: rotateX(10deg);
    }
    .drive-3d.rebuilt {
      background: linear-gradient(180deg, #dcfce7 0%, #86efac 100%);
      border-color: #22c55e;
      border-bottom-color: #15803d;
      color: #14532d;
    }

    .sector-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 0.45rem; }
    .sector-cube {
      aspect-ratio: 1;
      border-radius: 7px;
      border-bottom: 4px solid rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.68rem;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 4px 8px rgba(15, 23, 42, 0.1);
    }

    .info-panel { display: flex; flex-direction: column; justify-content: space-between; gap: 1.1rem; }
    .explain-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; padding: 1.15rem; }
    .explain-box h4 { font-size: 0.9rem; font-weight: 800; margin-bottom: 0.35rem; color: #0f172a; }
    .explain-box p { font-size: 0.86rem; color: #475569; line-height: 1.55; }

    .metrics-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
    .m-tile {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-bottom: 3px solid #cbd5e1;
      border-radius: 12px;
      padding: 0.75rem 0.9rem;
    }
    .m-tile .k { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: var(--muted); }
    .m-tile .v { font-size: 0.95rem; font-weight: 900; color: #0f172a; margin-top: 0.15rem; word-break: break-word; }

    /* Pipeline View */
    .panel-card {
      background: var(--surface);
      backdrop-filter: blur(12px);
      border-radius: 22px;
      padding: 1.5rem;
      box-shadow: 0 14px 32px -6px rgba(15, 23, 42, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.9);
    }
    .pipe-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 920px) { .pipe-grid { grid-template-columns: 1fr; } }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 0.8rem; }
    th { text-align: left; font-size: 0.72rem; color: var(--muted); padding: 0.65rem; border-bottom: 2px solid #e2e8f0; }
    td { padding: 0.7rem 0.65rem; border-bottom: 1px solid #f1f5f9; }

    /* Live 3D Packet Routing Movie Stage */
    .movie-stage {
      background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
      border-radius: 24px;
      padding: 1.35rem 1.6rem;
      margin-bottom: 1.65rem;
      box-shadow: 0 22px 45px -10px rgba(15, 23, 42, 0.28);
      border: 1px solid rgba(56, 189, 248, 0.25);
      position: relative;
      overflow: hidden;
      perspective: 1000px;
    }
    .movie-hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.65rem;
      color: #e2e8f0;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.6px;
    }
    .movie-track-wrap {
      position: relative;
      height: 195px;
      width: 100%;
      transform: rotateX(14deg);
      transform-style: preserve-3d;
    }
    .stage-node {
      position: absolute;
      border-radius: 16px;
      padding: 0.75rem 1rem;
      text-align: center;
      font-weight: 900;
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.35), inset 0 2px 6px rgba(255, 255, 255, 0.2);
      z-index: 4;
    }
    .node-capture {
      left: 1.5%; top: 58px; width: 175px;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border: 2px solid #38bdf8; color: #fff;
    }
    .node-scanner {
      left: 37%; top: 44px; width: 205px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border: 2px solid #c084fc; color: #fff;
      animation: scannerPulse 2.4s ease-in-out infinite;
    }
    @keyframes scannerPulse {
      0%, 100% { box-shadow: 0 0 20px rgba(167, 139, 250, 0.35), 0 14px 28px rgba(0,0,0,0.4); }
      50% { box-shadow: 0 0 36px rgba(56, 189, 248, 0.65), 0 14px 28px rgba(0,0,0,0.4); }
    }
    .node-clean {
      right: 1.5%; top: 10px; width: 185px;
      background: linear-gradient(135deg, #15803d, #16a34a);
      border: 2px solid #4ade80; color: #fff;
    }
    .node-trap {
      right: 1.5%; bottom: 8px; width: 185px;
      background: linear-gradient(135deg, #991b1b, #dc2626);
      border: 2px dashed #fca5a5; color: #fff;
      box-shadow: 0 0 24px rgba(239, 68, 68, 0.35), inset 0 0 14px rgba(0, 0, 0, 0.45);
    }

    /* Animated 3D Packet Cubes */
    .pkt-cube {
      position: absolute;
      width: 34px;
      height: 24px;
      border-radius: 7px;
      font-size: 0.62rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      z-index: 6;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.45), inset 0 2px 4px rgba(255, 255, 255, 0.6);
      pointer-events: none;
    }
    .pkt-safe {
      background: linear-gradient(135deg, #22c55e, #38bdf8);
      border: 1px solid #bbf7d0;
      animation: flySafe 4.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .pkt-threat {
      background: linear-gradient(135deg, #ef4444, #f97316);
      border: 1px solid #fecaca;
      animation: flyTrap 4.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes flySafe {
      0%   { left: 14%; top: 82px; opacity: 0; transform: scale(0.7) rotateY(-20deg); }
      12%  { opacity: 1; transform: scale(1) rotateY(0deg); }
      45%  { left: 45%; top: 82px; transform: scale(1.12); }
      60%  { left: 54%; top: 55px; }
      90%  { left: 82%; top: 32px; opacity: 1; transform: scale(0.95); }
      100% { left: 86%; top: 32px; opacity: 0; transform: scale(0.6); }
    }
    @keyframes flyTrap {
      0%   { left: 14%; top: 82px; opacity: 0; transform: scale(0.7) rotateZ(0deg); }
      12%  { opacity: 1; transform: scale(1); }
      45%  { left: 45%; top: 82px; transform: scale(1.22); }
      60%  { left: 54%; top: 118px; transform: rotateZ(12deg); }
      85%  { left: 82%; top: 142px; opacity: 1; transform: scale(1) rotateZ(0deg); }
      94%  { left: 83%; top: 142px; transform: scale(1.15); }
      100% { left: 84%; top: 142px; opacity: 0; transform: scale(0.5); }
    }


    /* System Health & Telemetry Ticker */
    .soc-ticker {
      background: #0f172a;
      color: #e2e8f0;
      padding: 0.48rem 2rem;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.4px;
      border-bottom: 1px solid rgba(56, 189, 248, 0.25);
      position: relative;
      z-index: 25;
    }
    .soc-ticker-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
    }
    .ticker-item { display: inline-flex; align-items: center; gap: 0.4rem; }
    .dot-live {
      width: 8px; height: 8px; border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      animation: blinkDot 1.6s infinite;
    }
    @keyframes blinkDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    /* Clickable Table Rows */
    tbody tr { cursor: pointer; transition: background 0.15s ease; }
    tbody tr:hover { background: #f1f5f9; }

    /* Slide-Over Packet Inspector Drawer */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.42);
      backdrop-filter: blur(4px);
      z-index: 120;
      display: none;
      justify-content: flex-end;
    }
    .drawer-backdrop.open { display: flex; }
    .inspector-drawer {
      width: 100%;
      max-width: 470px;
      background: #ffffff;
      height: 100%;
      box-shadow: -16px 0 45px rgba(15, 23, 42, 0.25);
      padding: 1.75rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      animation: slideLeft 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes slideLeft {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    .hex-box {
      background: #0f172a;
      color: #38bdf8;
      font-family: "Fira Code", monospace;
      font-size: 0.76rem;
      line-height: 1.55;
      padding: 1rem;

    function build3DVisual(modId, liveData, theme, jitter) {
      const meta = MODULE_DETAILS[modId] || { type: "nodes", nodes: ["Input", "Process", "Verified"] };

      if (meta.type === "pillars") {
        let bars = meta.bars.map(b => ({ ...b }));
        if (modId === "index_nosql" && liveData?.before_index && liveData?.after_composite_index) {
          bars[0].val = Math.min(96, Math.max(45, Math.round(liveData.before_index.avg_query_ms * 100)));
          bars[1].val = Math.max(10, Math.round(liveData.after_composite_index.avg_query_ms * 100));
        }
        return `
          <div class="stage-3d">
            <div class="stage-title">3D Dynamic Rise &amp; Fall Comparison</div>
            <div class="pillars-arena">
              ${bars.map((b, i) => {
                const delta = jitter ? ((i % 2 === 0 ? 1 : -1) * Math.floor(Math.random() * 14)) : 0;
                const h = Math.min(98, Math.max(14, b.val + delta));
                return `
                  <div class="pillar-col">
                    <div class="pillar-val">${h} ${b.unit}</div>
                    <div class="pillar-3d" style="height:${h}%; background:${b.color};"></div>
                    <div class="pillar-lbl">${b.label}</div>
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        `;
      }

      if (meta.type === "ring") {
        const pct = jitter ? Math.min(99, Math.max(84, meta.pct + (Math.random() > 0.5 ? 3 : -3))) : meta.pct;
        return `
          <div class="stage-3d">
            <div class="stage-title">3D Hardware Cache Hit Gauge</div>
            <div class="ring-wrap">
              <div class="ring-3d" style="background: conic-gradient(${theme.color} 0% ${pct}%, #cbd5e1 ${pct}% 100%);">
                <div class="ring-hole">
                  <div style="font-size:1.85rem; font-weight:900; color:${theme.color};">${pct}%</div>
                  <div style="font-size:0.68rem; font-weight:800; color:var(--muted);">${meta.ringLabel}</div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      if (meta.type === "raid") {
        const ds = liveData?.disk_scheduling || { fcfs_seek_cylinders: 640, sstf_seek_cylinders: 236 };
        const fcfsH = jitter ? 88 + Math.floor(Math.random() * 10) : 92;
        const sstfH = jitter ? 30 + Math.floor(Math.random() * 8) : 34;
        return `
          <div class="stage-3d">
            <div class="stage-title">3D Seek Pillars &amp; RAID-5 Drive Array</div>
            <div class="pillars-arena" style="height:145px;">
              <div class="pillar-col">
                <div class="pillar-val">${ds.fcfs_seek_cylinders} cyl</div>
                <div class="pillar-3d" style="height:${fcfsH}%; background:linear-gradient(180deg, #fb923c, #ea580c);"></div>
                <div class="pillar-lbl">FCFS Seek</div>
              </div>
              <div class="pillar-col">
                <div class="pillar-val">${ds.sstf_seek_cylinders} cyl</div>
                <div class="pillar-3d" style="height:${sstfH}%; background:linear-gradient(180deg, #22c55e, #16a34a);"></div>
                <div class="pillar-lbl">SSTF Optimal</div>
              </div>
            </div>
            <div class="drive-bay">
              <div class="drive-3d">DISK 0<br><span style="font-size:0.68rem; color:var(--muted);">ONLINE</span></div>
              <div class="drive-3d rebuilt">DISK 1<br><span style="font-size:0.68rem;">REBUILT</span></div>
              <div class="drive-3d">DISK 2<br><span style="font-size:0.68rem; color:var(--muted);">ONLINE</span></div>
              <div class="drive-3d">PARITY<br><span style="font-size:0.68rem; color:var(--m4);">XOR OK</span></div>
            </div>
          </div>
        `;
      }

      if (meta.type === "sectors") {
        const bad1 = jitter ? Math.floor(Math.random() * 10) + 2 : 5;
        const bad2 = jitter ? Math.floor(Math.random() * 10) + 15 : 19;
        const split1 = jitter ? Math.floor(Math.random() * 5) + 9 : 12;
        const split2 = jitter ? Math.floor(Math.random() * 5) + 20 : 22;
        const cubes = Array.from({ length: 32 }, (_, i) => {
          if (i === bad1 || i === bad2) return `<div class="sector-cube" style="background:#ef4444;" title="Bad Sector">X</div>`;
          if (i < split1) return `<div class="sector-cube" style="background:#0284c7;">C${i}</div>`;
          if (i < split2) return `<div class="sector-cube" style="background:#16a34a;">L${i}</div>`;
          return `<div class="sector-cube" style="background:#cbd5e1; color:#334155;">${i}</div>`;
        }).join("");
        return `
          <div class="stage-3d">
            <div class="stage-title">3D 32-Block Disk Bitmap (Blue: Contiguous · Green: Linked · Red: Bad)</div>
            <div class="sector-grid">${cubes}</div>
          </div>
        `;
      }

      const runId = Math.floor(100 + Math.random() * 900);
      const latMs = (0.18 + Math.random() * 1.45).toFixed(2);
      return `
        <div class="stage-3d">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div class="stage-title">3D Execution Stage Flow</div>
            <span class="pill" style="background:#dcfce7; color:#15803d;">RUN #${runId} · ${latMs} ms</span>
          </div>
          <div class="hex-flow">
            ${meta.nodes.map((n, idx) => `
              <div class="hex-node" style="border-bottom-color:${idx === meta.nodes.length - 1 ? '#16a34a' : theme.color};">
                ${n}
              </div>
              ${idx < meta.nodes.length - 1 ? '<span style="font-weight:900; color:#94a3b8;">➔</span>' : ''}
            `).join("")}
          </div>
        </div>
      `;
    }

    function toggleDarkSOC() {
      const isDark = document.body.classList.toggle("dark-soc");

    document.addEventListener("keydown", (e) => {
      const modalOpen = document.getElementById("studio-modal").classList.contains("open");
      if (!modalOpen || !currentMemberCache) return;
      const total = currentMemberCache.modules.length;
      if (e.key === "ArrowRight") openStudio((currentModIndex + 1) % total);
      if (e.key === "ArrowLeft") openStudio((currentModIndex - 1 + total) % total);
      if (e.key === "Escape") closeStudio();
    });

    function openStudio(modIndex, jitter = false) {
      currentModIndex = modIndex;
      if (!currentMemberCache) return;
      const m = currentMemberCache.modules[modIndex];
      const theme = MEMBER_THEMES[currentMemberId];
      const meta = MODULE_DETAILS[m.id] || { how: m.desc };
      const isDb = m.perspective.startsWith("DBMS");

      document.getElementById("st-badge").textContent = isDb ? "DBMS ENGINE" : "OS ENGINE";
      document.getElementById("st-badge").style.background = isDb ? "var(--m3-soft)" : theme.soft;
      document.getElementById("st-badge").style.color = isDb ? "var(--m3)" : theme.color;
      document.getElementById("st-title").textContent = m.title;

      const totalMods = currentMemberCache.modules.length;
      document.getElementById("st-prev").onclick = () => openStudio((modIndex - 1 + totalMods) % totalMods);
      document.getElementById("st-next").onclick = () => openStudio((modIndex + 1) % totalMods);

      const rerunBtn = document.getElementById("st-rerun");
      rerunBtn.style.background = theme.grad;
      rerunBtn.onclick = async () => {
        const res = await fetch(`/api/member/${currentMemberId}`);
        currentMemberCache = await res.json();
        openStudio(modIndex, true);
      };

      const cleanMetrics = Object.entries(m.data || {})
        .filter(([k]) => !k.startsWith("_"))
        .slice(0, 4)
        .map(([k, v]) => {
          let val = typeof v === "object" ? Object.values(v)[0] : v;
          if (typeof val === "boolean") val = val ? "VERIFIED" : "ACTIVE";
          return `
            <div class="m-tile">
              <div class="k">${k.replace(/_/g, " ")}</div>
              <div class="v">${val}</div>
            </div>
          `;
        }).join("");

      document.getElementById("st-body").innerHTML = `
        ${build3DVisual(m.id, m.data, theme, jitter)}
        <div class="info-panel">
          <div class="explain-box">
            <h4>How This Module Works</h4>
            <p>${meta.how}</p>
          </div>
          <div>
            <div class="stage-title" style="margin-bottom:0.6rem;">Live Execution Telemetry</div>
            <div class="metrics-list">${cleanMetrics}</div>
          </div>
        </div>
      `;

      document.getElementById("studio-modal").classList.add("open");
    }

              <div style="font-size:1.05rem; font-weight:900; color:#38bdf8;">${allocUnits} / 64 Units</div>
            </div>
            <div class="dbms-cube ${d.external_frag_pct > 35 ? 'danger' : 'success'}" style="min-width:0; padding:0.6rem; animation:none;">
              <div style="font-size:0.66rem; color:#94a3b8;">FRAGMENTATION</div>
              <div style="font-size:1.05rem; font-weight:900;">${d.external_frag_pct}%</div>
            </div>
            <div class="dbms-cube success" style="min-width:0; padding:0.6rem; animation:none;">
              <div style="font-size:0.66rem; color:#94a3b8;">ACTIVE POLICY</div>
              <div style="font-size:0.95rem; font-weight:900;">${d.policy.replace('_', ' ')}</div>
            </div>
          </div>
        </div>
      `;
    }

    async function loadP2Scheduler(algo = "RR", targetId = "p2-live-stage") {
      const box = document.getElementById(targetId);
      if (!box) return;
      const res = await fetch(`/api/p2/scheduler_metrics?algo=${algo}`);
      const d = await res.json();
      const grads = [
        "linear-gradient(180deg, #38bdf8, #0369a1)",
        "linear-gradient(180deg, #34d399, #047857)",
        "linear-gradient(180deg, #a78bfa, #5b21b6)",
        "linear-gradient(180deg, #fbbf24, #b45309)",
        "linear-gradient(180deg, #fb7185, #be123c)"
      ];

      box.innerHTML = `
        <div class="stage-title">⚙️ OS Kernel: 3D CPU Pipeline &amp; Gantt Execution</div>
        <div class="p2-toolbar">
          ${["FCFS", "SJF", "RR"].map(a => `
            <button class="p2-chip ${a === d.algo ? 'active' : ''}" onclick="loadP2Scheduler('${a}', '${targetId}')">${a === "RR" ? "Round Robin (Q=2)" : a}</button>
          `).join("")}
          <span class="pill" style="margin-left:auto; background:#e0f2fe; color:#0369a1;">Quantum: ${d.algo === 'RR' ? '2 ms' : 'Non-Preemptive'}</span>
        </div>
        <div class="dbms-3d-arena">
          <div style="display:flex; gap:6px; min-height:76px; align-items:stretch; overflow-x:auto; margin-bottom:0.95rem;">
            ${d.gantt.map(s => `
              <div class="os-3d-block" style="flex:${s.end - s.start} 0 auto; min-width:44px; background:${grads[(s.pid - 1) % grads.length]};">
                <span>P${s.pid}</span>
                <span style="font-size:0.64rem; opacity:0.9;">${s.start}→${s.end}</span>
              </div>
            `).join("")}
          </div>
          <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:0.75rem;">
            <div class="dbms-cube ${d.awt < 6.5 ? 'success' : 'amber'}" style="min-width:0; padding:0.6rem; animation:none;">
              <div style="font-size:0.66rem; color:#94a3b8;">AVG WAIT (AWT)</div>
              <div style="font-size:1.05rem; font-weight:900;">${d.awt} ms</div>
            </div>
            <div class="dbms-cube" style="min-width:0; padding:0.6rem; animation:none;">
              <div style="font-size:0.66rem; color:#94a3b8;">TURNAROUND</div>
              <div style="font-size:1.05rem; font-weight:900; color:#38bdf8;">${d.atat} ms</div>
            </div>
            <div class="dbms-cube amber" style="min-width:0; padding:0.6rem; animation:none;">
              <div style="font-size:0.66rem; color:#94a3b8;">CTX SWITCHES</div>
              <div style="font-size:1.05rem; font-weight:900;">${d.csw}</div>
            </div>
          </div>
        </div>
      `;
    }

    async function loadP2Paging(frames = 3, targetId = "p2-live-stage") {
      const box = document.getElementById(targetId);
      if (!box) return;
      const res = await fetch(`/api/p2/paging_stats?frames=${frames}`);
      const d = await res.json();
      const algos = [
        { name: "FIFO", val: d.faults.FIFO, grad: "linear-gradient(180deg, #f87171, #991b1b)" },
        { name: "LRU", val: d.faults.LRU, grad: "linear-gradient(180deg, #38bdf8, #075985)" },
        { name: "CLOCK", val: d.faults.CLOCK, grad: "linear-gradient(180deg, #a78bfa, #5b21b6)" },
        { name: "OPT", val: d.faults.OPT, grad: "linear-gradient(180deg, #34d399, #065f46)" }
      ];

      box.innerHTML = `
        <div class="stage-title">⚙️ OS Kernel: 3D Page Replacement &amp; Belady's Anomaly</div>
        <div class="p2-toolbar">
          ${[3, 4, 5].map(f => `
            <button class="p2-chip ${f === d.frames ? 'active' : ''}" onclick="loadP2Paging(${f}, '${targetId}')">${f} Physical Frames</button>
          `).join("")}
          <span class="pill" style="margin-left:auto; background:#f3e8ff; color:#6d28d9;">Active RAM Slots: ${d.frames}</span>
        </div>
        <div class="dbms-3d-arena">
          <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:0.85rem; align-items:end; height:145px; padding-top:0.5rem;">
            ${algos.map(a => `
              <div style="display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;">
                <div style="font-size:0.88rem; font-weight:900; color:#f8fafc; margin-bottom:4px;">${a.val} Faults</div>
                <div class="os-3d-block" style="width:72%; height:${Math.min(100, a.val * 9)}px; background:${a.grad};"></div>
                <div style="font-size:0.78rem; font-weight:900; color:#94a3b8; margin-top:6px;">${a.name}</div>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    async function loadP2Disk(diskAlgo = "LOOK", targetId = "p2-live-stage") {
      const box = document.getElementById(targetId);
      if (!box) return;
      const res = await fetch(`/api/p2/disk_seek?disk_algo=${diskAlgo}`);
      const d = await res.json();
      const headPct = Math.min(92, Math.max(6, (d.total_seek % 180) / 1.8));
      const targets = [14, 37, 65, 98, 122, 183];

      box.innerHTML = `
        <div class="stage-title">⚙️ OS Kernel: 3D Disk Platter &amp; Actuator Seek Head</div>
        <div class="p2-toolbar">
          ${["FCFS", "SCAN", "LOOK"].map(a => `
            <button class="p2-chip ${a === d.disk_algo ? 'active' : ''}" onclick="loadP2Disk('${a}', '${targetId}')">${a}</button>
          `).join("")}
          <span class="pill" style="margin-left:auto; background:#ffedd5; color:#c2410c;">Total Seek: ${d.total_seek} Cylinders</span>
        </div>
        <div class="dbms-3d-arena">
          <div style="display:flex; justify-content:space-between; font-size:0.72rem; color:#94a3b8; font-weight:800;">
            <span>CYLINDER 0</span>
            <span>INITIAL HEAD: ${d.initial_head}</span>
            <span>CYLINDER 199</span>
          </div>
          <div class="os-track-rail">
            ${targets.map(t => `<div class="os-track-dot" style="left:${(t / 200) * 100}%;" title="Track ${t}"></div>`).join("")}
            <div class="os-rw-head" style="left:${headPct}%;">R/W</div>
          </div>
          <div style="background:rgba(15,23,42,0.75); border:1px solid rgba(56,189,248,0.25); border-radius:10px; padding:0.6rem 0.85rem; font-size:0.8rem; color:#38bdf8; font-weight:800; text-align:center;">
            Head Path: ${d.order.join(" ➔ ")}
          </div>
        </div>
      `;
    }

    // Wrap renderMemberOverview cleanly without touching template strings
    const _origRenderMember = renderMemberOverview;
    renderMemberOverview = async function(mid) {
      await _origRenderMember(mid);
      const view = document.getElementById("app-root");
      if (!view) return;
      const p2Map = {
        1: () => loadP2Memory("FIRST_FIT", "p2-inline-box"),
        2: () => loadP2Scheduler("RR", "p2-inline-box"),
        3: () => loadP2Paging(3, "p2-inline-box"),
        4: () => loadP2Disk("LOOK", "p2-inline-box")
      };
      if (p2Map[mid] && !document.getElementById("p2-inline-box")) {
        const dualWrap = document.createElement("div");
        dualWrap.style.display = "grid";
        dualWrap.style.gridTemplateColumns = "1fr";
        dualWrap.style.gap = "1.4rem";
        dualWrap.style.marginBottom = "1.5rem";

        const osCard = document.createElement("div");
        osCard.className = "outer-card";
        osCard.style.cursor = "default";
        osCard.innerHTML = `<div class="card-accent" style="background:var(--m${mid}-grad);"></div><div id="p2-inline-box">Loading OS Simulator...</div>`;

        const dbmsCard = document.createElement("div");
        dbmsCard.className = "outer-card";
        dbmsCard.style.cursor = "default";
        dbmsCard.innerHTML = `<div class="card-accent" style="background:linear-gradient(90deg, #7c3aed, #0284c7);"></div><div id="dbms-inline-box">Loading DBMS Simulator...</div>`;

        dualWrap.appendChild(osCard);
        dualWrap.appendChild(dbmsCard);

        const grid = view.querySelector(".cards-grid") || view.lastElementChild;
        if (grid && grid.parentNode) {
          grid.parentNode.insertBefore(dualWrap, grid);
        } else {
          view.prepend(dualWrap);
        }
        p2Map[mid]();
        const dbmsMap = {
          1: () => loadDbmsMvcc("PREPARED", "dbms-inline-box"),
          2: () => loadDbmsOptimizer("BTREE_INDEX", "dbms-inline-box"),
          3: () => loadDbmsWal("REDO", "dbms-inline-box"),
          4: () => loadDbmsAcid("QUARANTINE_TRIGGER", "dbms-inline-box")
        };
        if (dbmsMap[mid]) dbmsMap[mid]();
      }
    };

    // Also hook inside build3DVisual modal for those 4 modules
    const _origBuild3D = build3DVisual;
    build3DVisual = function(modId, liveData, theme, jitter) {
      if (["paging", "scheduler", "working_set", "block_alloc"].includes(modId)) {
        setTimeout(() => {
          if (modId === "paging") loadP2Memory("FIRST_FIT", "p2-live-stage");
          if (modId === "scheduler") loadP2Scheduler("RR", "p2-live-stage");
          if (modId === "working_set") loadP2Paging(3, "p2-live-stage");
          if (modId === "block_alloc") loadP2Disk("LOOK", "p2-live-stage");
        }, 15);
        return `<div id="p2-live-stage" class="stage-3d">Initializing interactive simulator...</div>`;
      }
      return _origBuild3D(modId, liveData, theme, jitter);
    };

  </script>
  <script>
    (function initSentinel3D() {
      const canvas = document.getElementById("webgl-3d-bg");
      if (!canvas || typeof THREE === "undefined") return;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 34;

      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      // Central 3D Isometric Cyber Core (Wireframe Icosahedron + Inner Torus Knot)
      const coreGroup = new THREE.Group();
      scene.add(coreGroup);

      const icoGeo = new THREE.IcosahedronGeometry(9.5, 1);
      const icoMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, transparent: true, opacity: 0.22 });
      const icoMesh = new THREE.Mesh(icoGeo, icoMat);
      coreGroup.add(icoMesh);

      const knotGeo = new THREE.TorusKnotGeometry(4.6, 1.1, 90, 14);
      const knotMat = new THREE.MeshBasicMaterial({ color: 0x8b5cf6, wireframe: true, transparent: true, opacity: 0.25 });
      const knotMesh = new THREE.Mesh(knotGeo, knotMat);
      coreGroup.add(knotMesh);

      // Orbiting 3D Data Nodes & Neural Synapses
      const particleCount = 130;
      const positions = new Float32Array(particleCount * 3);
      for (let i = 0; i < particleCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 75;
        positions[i + 1] = (Math.random() - 0.5) * 48;
        positions[i + 2] = (Math.random() - 0.5) * 40;
      }
      const pGeo = new THREE.BufferGeometry();
      pGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const pMat = new THREE.PointsMaterial({ color: 0x38bdf8, size: 0.42, transparent: true, opacity: 0.75 });
      const particles = new THREE.Points(pGeo, pMat);
      scene.add(particles);

      // 3D Perspective Floor Grid Helper
      const gridHelper = new THREE.GridHelper(110, 28, 0x38bdf8, 0x6366f1);
      gridHelper.position.y = -16;
      gridHelper.material.transparent = true;
      gridHelper.material.opacity = 0.22;
      scene.add(gridHelper);

      let targetX = 0, targetY = 0;
      document.addEventListener("mousemove", (e) => {
        targetX = (e.clientX / window.innerWidth - 0.5) * 2;
        targetY = (e.clientY / window.innerHeight - 0.5) * 2;

        // 3D Card Tilt & Specular Glow
        const card = e.target.closest(".outer-card");
        if (card) {
          const rect = card.getBoundingClientRect();
          const rx = ((e.clientY - rect.top) / rect.height - 0.5) * -5;
          const ry = ((e.clientX - rect.left) / rect.width - 0.5) * 5;
          card.style.setProperty("--mx", `${((e.clientX - rect.left) / rect.width) * 100}%`);
          card.style.setProperty("--my", `${((e.clientY - rect.top) / rect.height) * 100}%`);
          card.style.transform = `perspective(1100px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) translateY(-3px)`;
        }
      });

      document.addEventListener("mouseout", (e) => {
        const card = e.target.closest(".outer-card");
        if (card && !card.contains(e.relatedTarget)) {
          card.style.transform = "";
        }
      });

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function animate() {
        requestAnimationFrame(animate);
        const isDark = document.body.classList.contains("dark-soc");
        icoMat.opacity = isDark ? 0.26 : 0.14;
        knotMat.opacity = isDark ? 0.30 : 0.16;
        gridHelper.material.opacity = isDark ? 0.26 : 0.14;

        icoMesh.rotation.y += 0.0025;
        icoMesh.rotation.x += 0.0012;
        knotMesh.rotation.y -= 0.004;
        knotMesh.rotation.z += 0.002;
        particles.rotation.y += 0.0008;

        coreGroup.rotation.y += (targetX * 0.45 - coreGroup.rotation.y) * 0.05;
        coreGroup.rotation.x += (targetY * 0.3 - coreGroup.rotation.x) * 0.05;
        camera.position.x += (targetX * 3.5 - camera.position.x) * 0.04;
        camera.position.y += (-targetY * 2.2 - camera.position.y) * 0.04;
        camera.lookAt(0, 0, 0);

        renderer.render(scene, camera);
      }
      animate();
    })();
  </script>
